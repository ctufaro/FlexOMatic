<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex-O-Matic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Fredoka", sans-serif;
            background: radial-gradient(circle at top center, #5b21b6, #1e1b4b);
            color: white;
            overflow-x: hidden;
        }

        .title-font {
            font-family: "Luckiest Guy", cursive;
        }

        input::placeholder {
            color: #ddd;
            font-size: 1.25rem;
        }

        .card-title {
            font-size: 1.6rem;
            font-weight: 700;
            font-family: 'Fredoka',sans-serif;
        }

        .rarity-badge {
            font-weight: bold;
            letter-spacing: .05em;
        }

        @keyframes modalEnter {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .animate-modalEnter {
            animation: modalEnter 0.25s ease-out forwards;
        }

    </style>
</head>
<body class="min-h-screen">

    <!-- HEADER -->
    <header class="w-full bg-gradient-to-r from-yellow-300 to-orange-400 text-black shadow-xl">
        <div class="max-w-7xl mx-auto px-4 py-2 flex flex-col md:flex-row flex-nowrap items-center justify-between gap-0">
            <!-- Logo -->
            <h1 class="text-4xl md:text-5xl title-font whitespace-nowrap m-0 p-0 leading-none">🌽 FLEX-O-MATIC</h1>

            <!-- One-line submission -->
            <form id="cropForm" class="flex flex-1 min-w-0 items-center gap-2 ml-3">
                <input id="cropInput" type="text" placeholder="Suggest a new crop…"
                       class="w-full min-w-0 px-4 py-2 rounded border-4 border-black text-black text-lg font-bold focus:outline-none"
                       required />
                <button type="submit"
                        class="shrink-0 bg-gray-500 cursor-not-allowed text-white px-5 py-2 text-lg border-4 border-black rounded uppercase"
                        disabled>
                    SUBMIT DISABLED
                </button>
            </form>

            <div id="loader" class="hidden text-white text-base md:text-lg w-full md:w-auto mt-2 md:mt-0">🌱 Growing your crop...</div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="p-6">
        <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2">
            <!-- populated by JS -->
        </div>
    </main>

    <!-- CREDIT MODAL -->
    <div id="creditModal" class="fixed inset-0 hidden items-center justify-center bg-black/60 z-50">
        <div class="bg-white rounded-lg shadow-xl overflow-hidden transform transition-all scale-95 opacity-0 animate-modalEnter">

            <!-- Header -->
            <div class="bg-gradient-to-r from-yellow-300 to-orange-400 px-4 py-3">
                <canvas id="confettiCanvas" class="absolute inset-0 pointer-events-none"></canvas>
                <h2 class="text-lg font-bold text-black flex items-center gap-2">
                    🌽 Want credit for this idea?
                </h2>
            </div>

            <!-- Body -->
            <div class="p-5">
                <p class="text-sm text-gray-700 mb-4">
                    Add your Roblox name so we can shout you out if it gets picked!
                </p>

                <input id="robloxNameInput"
                       type="text"
                       placeholder="Your Roblox name"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md mb-3 focus:outline-none focus:ring-2 focus:ring-yellow-400 text-black placeholder-gray-500" />


                <label class="flex items-center gap-2 text-sm text-gray-700 mb-4">
                    <input id="rememberName" type="checkbox" class="w-4 h-4">
                    Remember this name for next time
                </label>

                <div class="flex justify-end gap-2">
                    <button id="skipCreditBtn" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded">Skip</button>
                    <button id="saveCreditBtn" class="px-3 py-1 bg-green-600 hover:bg-green-700 text-white rounded">Save</button>
                </div>
            </div>
        </div>
    </div>


    <script src="main.js" defer></script>
</body>
</html>
